# Default branch: adjust `branches:` if your repo uses something other than main/master.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-static-lang:
    runs-on: ubuntu-latest
    # Gate must stay snappy: fuzzupstream ASAN smokes alone can take ~10m and drown
    # signal from poolfuzz/hermetic unit flakes. Heavy Hunt lives in fuzzupstream-smoke.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum

      - name: Install jq (report_summary / scripts)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build security WASM pack (poolfuzz / coordinator tests)
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build_security_task_pack.sh
          bash scripts/build_task_wasm.sh

      # Nightly cargo only needed for lang_static / optional Hunt tooling — keep light.
      - name: Ensure Rust nightly cargo (Hunt tooling)
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          rustup component add cargo --toolchain nightly || true
          if ! cargo +nightly -V; then
            echo "::warning::cargo +nightly still unavailable after repair — rust ASAN tests will skip"
          else
            cargo +nightly -V
            rustc +nightly -V
          fi

      - name: Go fmt check
        run: bash scripts/ops/gofmt_check.sh

      - name: Code quality audit
        run: bash scripts/ops/code_quality_audit.sh

      - name: Go vet
        run: go vet ./...

      - name: govulncheck
        env:
          # Allow downloading the go.mod toolchain patch if runner pins older 1.26.x.
          GOTOOLCHAIN: auto
        run: |
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Go test + coverage (gate, exclude fuzzupstream)
        env:
          # Hermetic Hunt lease math even if runner env bleeds coverage-engine=0.
          HACKME_HUNT_COVERAGE_ENGINE: "1"
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -v '/internal/fuzzupstream$')
          go test "${pkgs[@]}" -count=1 -shuffle=on -timeout 15m -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Language static (manifest lint + WASM ABI + rollup)
        env:
          RUN_ID: ci-${{ github.run_id }}
        run: MODE=lang_static bash scripts/tests/run_daily.sh

  fuzzupstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Ensure Rust nightly cargo (ASAN smokes)
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          rustup component add cargo --toolchain nightly || true
          cargo +nightly -V || echo "::warning::cargo +nightly missing — smokes that need ASAN will skip"
      - name: fuzzupstream package tests
        run: go test ./internal/fuzzupstream/ -count=1 -timeout 35m
  coordinator-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Coordinator payout and difficulty tests
        run: go test ./cmd/coordinator/... ./internal/chain/... -count=1 -run 'TestPayout|TestPool|TestMaybeRetarget|TestRetarget'
      # Full pool + consensus suites under the race detector (incl. TestSecurity*, ASERT,
      # TestSecurityClaimWithoutTipDoesNotDeadlock): lock leaks and data races fail here.
      - name: Coordinator, chain and settlement under -race
        run: go test -race -count=1 -shuffle=on -timeout 25m ./cmd/coordinator/ ./internal/chain/ ./internal/workersettle/ ./internal/checkpoint/

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build e2e binaries
        run: |
          go build -trimpath -o bin/coordinator-e2e ./cmd/coordinator
          go build -trimpath -o bin/hackme-e2e .
      - name: Playwright E2E
        run: bash scripts/tests/run_ui_e2e.sh

  windows-ootb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows Dig/PoH OOTB honesty (no Hunt engines promised)
        # Public status curl is best-effort in CI (flaky egress); local file gates always run.
        run: SKIP_PUBLIC_STATUS=1 bash scripts/ops/windows_miner_ootb_checklist.sh
