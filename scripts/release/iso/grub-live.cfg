# HackMe OS GRUB — casper live. Default: text console (no black Plymouth screen).
set default=0
set timeout=8
set gfxmode=auto
set gfxpayload=text
insmod gfxterm
insmod all_video
terminal_output gfxterm

menuentry "HackMe OS (live · recommended)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root noplymouth plymouth.enable=0 console=tty1 systemd.show_status=1 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · safe graphics)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root nomodeset nvidia.modeset=0 nouveau.modeset=0 amdgpu.modeset=0 radeon.modeset=0 i915.modeset=0 fbcon=font:VGA8x16 noplymouth plymouth.enable=0 console=tty1 systemd.show_status=1 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · debug · all messages)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root noplymouth plymouth.enable=0 console=tty1 console=ttyS0,115200n8 systemd.log_level=info ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · boot splash)" {
  set gfxpayload=keep
  linux /casper/vmlinuz boot=casper username=root quiet splash ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · max performance · 8GB+ RAM)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root toram noplymouth plymouth.enable=0 console=tty1 intel_pstate=disable systemd.show_status=1 ---
  initrd /casper/initrd
}
