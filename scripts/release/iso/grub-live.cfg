# HackMe OS GRUB — casper live (xz squashfs). Default: text console.
set default=0
set timeout=10
set gfxmode=auto
set gfxpayload=text
insmod gfxterm
insmod all_video
terminal_output gfxterm

menuentry "HackMe OS (live · recommended)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root noplymouth plymouth.enable=0 console=tty1 systemd.show_status=1 live-media-timeout=300 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · safe graphics)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root nomodeset nvidia.modeset=0 nouveau.modeset=0 amdgpu.modeset=0 radeon.modeset=0 i915.modeset=0 fbcon=font:VGA8x16 noplymouth plymouth.enable=0 console=tty1 systemd.show_status=1 live-media-timeout=300 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · USB slow / load to RAM)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root toram noplymouth plymouth.enable=0 console=tty1 systemd.show_status=1 live-media-timeout=600 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · debug · all messages)" {
  set gfxpayload=text
  linux /casper/vmlinuz boot=casper username=root noplymouth plymouth.enable=0 console=tty1 console=ttyS0,115200n8 systemd.log_level=info live-media-timeout=300 ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · boot splash)" {
  set gfxpayload=keep
  linux /casper/vmlinuz boot=casper username=root quiet splash live-media-timeout=300 ---
  initrd /casper/initrd
}
