# HackMe OS GRUB entries — Ubuntu casper live (no toram by default: fast USB boot).
set default=0
set timeout=6
set gfxmode=1024x768,auto
set gfxpayload=keep
insmod gfxterm
insmod png
terminal_output gfxterm
if [ -f ($root)/boot/grub/themes/hackme/theme.txt ]; then
  set theme=($root)/boot/grub/themes/hackme/theme.txt
  export theme
fi

menuentry "HackMe OS (live · recommended)" {
  linux /casper/vmlinuz boot=casper quiet splash ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · safe graphics)" {
  linux /casper/vmlinuz boot=casper nomodeset xforcevesa quiet splash ---
  initrd /casper/initrd
}
menuentry "HackMe OS (live · max performance · 8GB+ RAM)" {
  linux /casper/vmlinuz boot=casper toram quiet splash intel_pstate=disable ---
  initrd /casper/initrd
}
