# Production TLS vhost for hackme.tech (paths: /etc/ssl/certs/hackme-origin.crt).
# Install: sudo cp to /etc/nginx/sites-available/hackme-site-domain.conf
# Or: NODE_SSH=hackme-vps bash scripts/ops/deploy_hackme_public_stack.sh
server {
    listen 80;
    listen [::]:80;
    server_name hackme.tech www.hackme.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hackme.tech www.hackme.tech;

    ssl_certificate /etc/ssl/certs/hackme-origin.crt;
    ssl_certificate_key /etc/ssl/private/hackme-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/hackme/web/site;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Lightweight origin probe (static; survives node outage — use for CF/uptime checks).
    location = /healthz.html {
        try_files /healthz.html =404;
        add_header Cache-Control "no-store" always;
    }

    location /dist/ {
        alias /opt/hackme/dist/;
        autoindex off;
    }

    location = /explorer {
        return 302 /pool/explorer;
    }

    location = /dashboard {
        return 302 /pool/explorer;
    }

    # B2B fuzzing: no public fuzz or remote compiler (integrators use developer console / CLI + scoped token).
    location = /api/tasks/from_code {
        return 403;
    }
    # Customer deliverables: GET report/pulse/gate/csv with X-Hackme-Report-Token (node enforces).
    location ~ ^/api/fuzz/campaigns/[^/]+/(report\.html|report\.csv|report|pulse|gate)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080;
    }
    location ~ ^/api/fuzz(/.*)?$ {
        return 403;
    }

    location ~ ^/api/integrator(/.*)?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18080;
    }

    location ~ ^/api/tasks$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /api/settlement/canonical.json {
        alias /opt/hackme/data/settlement_canonical_public.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location ~ ^/api/(status|metrics|global/metrics|reports/blocks|chain|tx/pool|p2p/peers|p2p/sync|work/stats|work/by-wallet|worker/status|worker/settlement|miner/notices|network/stats|wallet|wallet/earnings|sup/economics|hms/economics|hms/pool/stats)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }
    location ~ ^/api/tx/[A-Za-z0-9]+$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }
    location ~ ^/api/address/[A-Za-z0-9-]+$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }

    # Signed transfer submit (followers proxy to command node; public nginx used to return 403 for all /api/).
    location = /api/tx/send {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:18080;
    }

    # B2B orders run on the customer's local node (127.0.0.1:8080) — no web portal.
    location = /developer-dashboard.html {
        return 302 /downloads.html#local-node;
    }

    location = /developer-console.html {
        return 302 /downloads.html#local-node;
    }

    location = /pool/developer {
        return 302 /downloads.html#local-node;
    }

    location = /pool/developer/ {
        return 302 /downloads.html#local-node;
    }

    location = /pool/developer-dashboard.html {
        return 302 /downloads.html#local-node;
    }

    location = /pool {
        return 302 /pool/explorer;
    }

    location = /pool/ {
        return 302 /pool/explorer;
    }

    location = /pool/explorer {
        return 302 /explorer-lite.html;
    }

    location = /pool/explorer/live {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080/explorer;
    }

    # Short URL for pool listing sites (MiningPoolStats API field).
    location = /api/pool/stats {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18081/api/pool/stats;
    }

    # Pool miners over HTTPS: coordinator API (token-gated POSTs + stats).
    location = /pool/coordinator/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18081/health;
    }

    # Pool miners over HTTPS: coordinator API allowlist (admin routes blocked at edge).
    location ~ ^/pool/coordinator/api/ {
        return 403;
    }

    location = /pool/coordinator/api/work/claim {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/work/claim;
    }

    location = /pool/coordinator/api/work/submit {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/work/submit;
    }

    location = /pool/coordinator/api/work/stats {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/work/stats$is_args$args;
    }

    location = /pool/coordinator/api/work/by-wallet {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/work/by-wallet$is_args$args;
    }

    location = /pool/coordinator/api/pool/stats {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/pool/stats$is_args$args;
    }

    location = /pool/coordinator/api/network/stats {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/network/stats$is_args$args;
    }

    location = /pool/coordinator/api/fuzz/work/claim {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/work/claim;
    }

    location = /pool/coordinator/api/fuzz/work/submit {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/work/submit;
    }

    location = /pool/coordinator/api/fuzz/pool/stats {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/pool/stats$is_args$args;
    }

    location = /pool/coordinator/api/fuzz/pool/campaigns/list {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/pool/campaigns/list$is_args$args;
    }

    # Customer local nodes register pool-distributed fuzz campaigns (coordinator validates admin token).
    location = /pool/coordinator/api/fuzz/pool/campaigns {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/pool/campaigns;
    }

    location = /pool/coordinator/api/fuzz/pool/campaigns/status {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18081/api/fuzz/pool/campaigns/status;
    }

    location ~ ^/pool/api/integrator(/.*)?$ {
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /pool/api/tasks/from_code {
        return 403;
    }
    location ~ ^/pool/api/fuzz/campaigns/[^/]+/(report\.html|report\.csv|report|pulse|gate)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080;
    }
    location ~ ^/pool/api/fuzz(/.*)?$ {
        return 403;
    }
    location = /pool/api/tasks {
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080;
    }

    location ~ ^/pool/api/(status|metrics|global/metrics|reports/blocks|chain|tx/pool|p2p/peers|p2p/sync|work/stats|work/by-wallet|worker/status|worker/settlement|miner/notices|network/stats|wallet|wallet/earnings|sup/economics|hms/economics|hms/pool/stats)$ {
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:18080;
    }

    location ~ ^/pool/api/tx/[A-Za-z0-9]+$ {
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }

    location ~ ^/pool/api/address/[A-Za-z0-9-]+$ {
        rewrite ^/pool/api/(.*)$ /api/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /pool/api/tx/send {
        rewrite ^/pool/api/tx/send$ /api/tx/send break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://127.0.0.1:18080;
    }

    location /pool/api/ {
        return 403;
    }

    location /pool/ {
        return 404;
    }

    location /api/ {
        return 403;
    }

    location ^~ /docs/ {
        alias /opt/hackme/docs/;
        default_type text/plain;
        charset utf-8;
    }

    location ^~ /spec/ {
        alias /opt/hackme/spec/;
        default_type text/plain;
        charset utf-8;
    }

    location = /README.md {
        alias /opt/hackme/web/site/README.md;
        default_type text/plain;
        charset utf-8;
    }

    location ~ ^/README_.*\.md$ {
        root /opt/hackme;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
