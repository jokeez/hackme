# Included inside location /dist/ .
# RC / fix releases re-upload the SAME filename — never use "immutable" or year-long TTL,
# or Cloudflare will serve stale tarballs after an in-place fix (seen on 0.1.0-rc13 linux).
    add_header Cache-Control "public, max-age=120, must-revalidate" always;
    add_header CDN-Cache-Control "max-age=120, must-revalidate" always;
    add_header Accept-Ranges "bytes" always;
