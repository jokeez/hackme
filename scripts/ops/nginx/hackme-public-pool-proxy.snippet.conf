# Paste inside the HTTPS server { } block for hackme.tech (see tmp/hackme-site-domain.conf for full example).
#
# - Lets the landing page call GET /api/global/metrics without /pool prefix.
# - Exposes coordinator work API at https://SITE/pool/coordinator/api/... → 127.0.0.1:18081/api/...

location ~ ^/api/(status|metrics|global/metrics|reports/blocks|tx/pool|worker/settlement|wallet/earnings)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18080;
}

location = /api/tx/send {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_pass http://127.0.0.1:18080;
}

location = /pool/coordinator/health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18081/health;
}

location ~ ^/pool/coordinator/api/(.*)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18081/api/$1$is_args$args;
}
