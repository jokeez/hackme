# DEPRECATED — do NOT paste this catch-all into a live vhost.
#
# The old `location ~ ^/pool/coordinator/api/(.*)$` proxy opened ALL coordinator
# routes (including admin) at the public edge (M-HIGH-18).
#
# Use the exact allowlist in scripts/ops/nginx/hackme-site-domain.tls.conf instead
# (deny-by-default `location ~ ^/pool/coordinator/api/ { return 403; }` + explicit
# claim/submit/stats/fuzz paths).
#
# Safe public node metrics (optional). X-Forwarded-For is set from $remote_addr
# so client-supplied XFF cannot spoof abuse keys when the coordinator trusts XFF.

location ~ ^/api/(status|metrics|global/metrics|reports/blocks|tx/pool|worker/settlement|wallet/earnings)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18080;
}

location = /api/tx/send {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_pass http://127.0.0.1:18080;
}

location = /pool/coordinator/health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18081/health;
}

# Catch-all coordinator proxy removed (was M-HIGH-18). Explicit deny if this
# snippet is still included somewhere by mistake:
location ~ ^/pool/coordinator/api/(.*)$ {
    return 403;
}
