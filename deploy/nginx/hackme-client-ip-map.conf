# Real client IP behind Cloudflare (origin is CF-allowlisted on :443).
# Used as X-Real-IP for coordinator publish rate keys — without this, every
# CF edge shares one Orders publish bucket and customers hit 429 unfairly.
map $http_cf_connecting_ip $hackme_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
