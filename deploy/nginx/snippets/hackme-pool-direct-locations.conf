# Shared miner allowlist for pool-direct (cleartext :18083 and TLS :18443).
# Managed in-repo; install to /etc/nginx/snippets/ on hub.

    location = /health {
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/work/claim {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/work/submit {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/work/stats {
        limit_req zone=hackme_pool_stats burst=120 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/pool/stats {
        limit_req zone=hackme_pool_stats burst=120 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/miningboard/hmc {
        limit_req zone=hackme_pool_stats burst=120 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/work/by-wallet {
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Desktop #mining marketplace + settle pull (read/claim paths only; admin stays 403).
    location = /api/fuzz/pool/campaigns/list {
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/pool/campaigns/progress {
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Orders node findings mirror (coordinator still requires admin token).
    location = /api/fuzz/pool/campaigns/findings {
        limit_except GET { deny all; }
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location = /api/fuzz/pool/stats {
        limit_req zone=hackme_pool_stats burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/pool/settle/outbox {
        # Origin settle-pull only — loopback (not broad RFC1918 on cleartext :18083).
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=hackme_pool_settle burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location = /api/fuzz/pool/settle/outbox/ack {
        # ACK without Apply burns payouts — never expose on public cleartext.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=hackme_pool_settle burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/work/claim {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/fuzz/work/submit {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Dig corpus freeze + lease release / batch claim (worker token).
    # Without these, :18083 falls through to `location / { return 403; }` and Dig stalls after claim.
    location = /api/fuzz/work/claim_batch {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/fuzz/work/corpus_snapshot {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 8m;
    }
    location = /api/fuzz/work/release {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /api/fuzz/work/submit_batch {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/fuzz/work/corpus_delta {
        limit_req zone=hackme_pool_claim burst=40 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 8m;
    }

    # Hunt harness GET for cleartext pool-direct workers (hash-validated).
    location ~ "^/api/fuzz/pool/hunt/harness/[a-fA-F0-9]{8,128}$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=hackme_pool_stats burst=120 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Hunt harness POST (admin publish) — loopback/private only; miners use GET above.
    location = /api/fuzz/pool/hunt/harness {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_except POST { deny all; }
        limit_req zone=hackme_pool_settle burst=10 nodelay;
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/work/admin {
        return 403;
    }
    location ^~ /api/fuzz/pool/campaigns/cleanup {
        return 403;
    }
    location / {
        return 403;
    }