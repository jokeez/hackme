# HackMe pool / edge rate-limit zones (included from http{} via conf.d/).
# Claim/submit stay generous for GPU fleets; settle/stats cover progress mirrors.

limit_req_zone $binary_remote_addr zone=hackme_pool_claim:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=hackme_pool_settle:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=hackme_pool_stats:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=hackme_pool_conn:10m;

# API clients expect JSON, not nginx default HTML 429 pages (through CF too).
limit_req_status 429;
limit_conn_status 429;
