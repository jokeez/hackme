# HackMe pool / edge rate-limit zones (included from http{} via conf.d/).
# Claim/submit stay generous for GPU fleets; settle/stats are tighter.

limit_req_zone $binary_remote_addr zone=hackme_pool_claim:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=hackme_pool_settle:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=hackme_pool_stats:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=hackme_pool_conn:10m;

# Log throttles for fail2ban (does not change response body).
limit_req_status 429;
limit_conn_status 429;
