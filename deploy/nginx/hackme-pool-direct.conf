# Direct pool coordinator (bypass Cloudflare) — miner allowlist only.
# Install: sudo cp deploy/nginx/hackme-pool-direct.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Miners: COORD_URL=http://<origin-ip>:18083
#
# SECURITY: port 18083 is cleartext HTTP. Firewall to miner IPs only (or wireguard).
# Do not expose admin settle/outbox/ack routes on this listener without TLS + admin token.
# Prefer Cloudflare/TLS edge for anything beyond claim/submit/health.
#
# Rate limits (zones defined in conf.d/hackme-rate-limit.conf):
#   claim/submit — generous (fleet miners)
#   settle/stats — tighter (abuse / chatty settle loops)

server {
    listen 18083;
    listen [::]:18083;
    server_name _;
    client_max_body_size 8m;

    # Soft connection cap per IP (DDoS / runaway clients).
    limit_conn hackme_pool_conn 64;

    location = /health {
        limit_req zone=hackme_pool_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/work/claim {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/work/submit {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/work/stats {
        limit_req zone=hackme_pool_stats burst=40 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/pool/stats {
        limit_req zone=hackme_pool_stats burst=40 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/work/by-wallet {
        limit_req zone=hackme_pool_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Desktop #mining marketplace + settle pull (read/claim paths only; admin stays 403).
    location = /api/fuzz/pool/campaigns/list {
        limit_req zone=hackme_pool_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/pool/campaigns/progress {
        limit_req zone=hackme_pool_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/pool/stats {
        limit_req zone=hackme_pool_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/pool/settle/outbox {
        # Origin settle-pull only — not for public miners on cleartext :18083.
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_req zone=hackme_pool_settle burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location = /api/fuzz/pool/settle/outbox/ack {
        # ACK without Apply burns payouts — never expose on public cleartext.
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_req zone=hackme_pool_settle burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/fuzz/work/claim {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api/fuzz/work/submit {
        limit_req zone=hackme_pool_claim burst=80 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /api/work/admin {
        return 403;
    }
    location ^~ /api/fuzz/pool/campaigns/cleanup {
        return 403;
    }
    location / {
        return 403;
    }
}
