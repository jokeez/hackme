# Customer-friendly pool coordinator defaults.
# Install: sudo cp to /etc/systemd/system/hackme-coordinator.service.d/
# then daemon-reload + restart. If the same keys exist in EnvironmentFile
# (.env.coord), update those too — EnvironmentFile can win depending on merge order.
#
# Publish caps are per client IP (nginx must pass CF-Connecting-IP as X-Real-IP —
# see deploy/nginx/hackme-client-ip-map.conf).
[Service]
Environment=HACKME_ORDERS_PUBLISH_MAX_PER_HOUR=600
Environment=HACKME_ORDERS_PUBLISH_MAX_PER_DAY=3000
Environment=HACKME_ORDERS_SETTLE_MAX_PER_HOUR=1200
Environment=HACKME_ORDERS_SETTLE_MAX_PER_DAY=20000
Environment=HACKME_FUZZ_CLAIM_GHS_DIG_ONLY_PCT=35
