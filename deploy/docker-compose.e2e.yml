# Ephemeral stack: coordinator + node on a private bridge (e2e / CI).
# From repo root:
#   export E2E_TOKEN="$(openssl rand -hex 24)"
#   export E2E_WORKER_TOKEN="$(openssl rand -hex 24)"
#   export E2E_PUBLISH_TOKEN="$(openssl rand -hex 24)"
#   bash scripts/ops/docker_e2e_smoke.sh
#
# Image build uses `docker build --network=host` (bridge DNS often cannot resolve
# proxy.golang.org). Admin / worker / publish tokens MUST differ.
name: hackme-e2e
services:
  coordinator:
    image: hackme-e2e:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        HACKME_VERSION: "${HACKME_VERSION:-0.1.0-rc18.1}"
    command: ["/usr/local/bin/coordinator"]
    environment:
      HACKME_COORDINATOR_ADDR: "0.0.0.0:8081"
      HACKME_COORDINATOR_ADMIN_TOKEN: "${E2E_TOKEN:?set E2E_TOKEN}"
      HACKME_COORDINATOR_WORKER_TOKEN: "${E2E_WORKER_TOKEN:?set E2E_WORKER_TOKEN}"
      HACKME_COORDINATOR_ORDERS_PUBLISH_TOKEN: "${E2E_PUBLISH_TOKEN:?set E2E_PUBLISH_TOKEN}"
      HACKME_POOL_HYBRID_SIGNER_ENABLED: "1"
      HACKME_COORDINATOR_DB: "/data/coordinator.db"
      HACKME_WASM_VALIDATE_BIN: "/opt/hackme/bin/hackme-wasm-check"
    volumes:
      - coord_data:/data
    ports:
      - "127.0.0.1:${COORD_PUBLISH_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/network/stats"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  node:
    image: hackme-e2e:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        HACKME_VERSION: "${HACKME_VERSION:-0.1.0-rc18.1}"
    depends_on:
      - coordinator
    restart: on-failure:3
    command: ["/usr/local/bin/hackme"]
    environment:
      HACKME_WORKING_DIR: "/opt/hackme"
      HACKME_DATA_DIR: "/data"
      HACKME_BIND_ADDR: "0.0.0.0:8080"
      HACKME_ADMIN_TOKEN: "${E2E_TOKEN:?set E2E_TOKEN}"
      HACKME_REQUIRE_ADMIN_TOKEN: "1"
      HACKME_DESKTOP_MODE: "1"
      HACKME_P2P_TOKEN: "${E2E_TOKEN:?set E2E_TOKEN}"
      HACKME_RIG_PROFILE_AUTO: "0"
      HACKME_POOL_COORDINATOR_URL: "http://coordinator:8081"
      HACKME_POOL_COORDINATOR_TOKEN: "${E2E_WORKER_TOKEN:?set E2E_WORKER_TOKEN}"
      HACKME_POOL_ORDERS_PUBLISH_TOKEN: "${E2E_PUBLISH_TOKEN:?set E2E_PUBLISH_TOKEN}"
      HACKME_FUZZ_SETTLE_PULL: "1"
      HACKME_FUZZ_AUTORUN: "0"
      HACKME_GPU_DISABLE: "1"
      HACKME_MINER_CPU_PCT: "${HACKME_MINER_CPU_PCT:-70}"
      HACKME_WORKER_SIGN_SUBMITS: "1"
      HACKME_WORKER_HYBRID_FUZZ: "1"
      HACKME_WORKER_HYBRID_FUZZ_MODE: "inline"
      HACKME_WORKER_HYBRID_FUZZ_TIMEOUT_MS: "2000"
      HACKME_WORKERFUZZ_BIN: "/opt/hackme/bin/workerfuzz"
      HACKME_WORKER_WATCHDOG: "0"
      WORKER_AUTOSTART: "0"
      HACKME_WASM_VALIDATE_BIN: "/opt/hackme/bin/hackme-wasm-check"
      HACKME_HUNT_ISOLATE_STRICT: "${HACKME_HUNT_ISOLATE_STRICT:-}"
      HACKME_HUNT_BUILD_SANDBOX: "${HACKME_HUNT_BUILD_SANDBOX:-}"
    volumes:
      - node_data:/data
    ports:
      - "127.0.0.1:${NODE_PUBLISH_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
      interval: 3s
      timeout: 4s
      retries: 25
      start_period: 8s

volumes:
  coord_data:
  node_data:
