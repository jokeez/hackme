name: HackMe Fuzz (Dig)
description: >-
  Build a guard wasm on every PR, check it with the same sandbox gate the
  HackMe pool uses and show the Dig plan (preset / guard_pack / package) as a
  PR comment. Dry-run only for now: nothing is sent, no secrets needed.
author: HackMe contributors
branding:
  icon: shield
  color: green

inputs:
  wasm:
    description: Prebuilt guard .wasm, relative to the workspace.
    required: false
    default: ""
  source:
    description: Single-file guard source to compile (WASM ABI v1, exports check). Use with `language`.
    required: false
    default: ""
  language:
    description: "Language of `source`: rust | c | cpp."
    required: false
    default: ""
  dig-preset:
    description: "One-click Dig preset with a shipped guard: scan_smoke, overflow_smoke, bounds_smoke, state_smoke, script_bounds, secrets, filter_utf8, parser_expat."
    required: false
    default: ""
  guard-pack:
    description: Guard pack whose config (input mode, seeds, budgets) is applied — to your wasm, or run as-is when no wasm/source is given.
    required: false
    default: ""
  package:
    description: "Dig package: scan | audit | deep. Defaults to the preset/pack default, else scan."
    required: false
    default: ""
  title:
    description: Campaign title shown in the plan.
    required: false
    default: ""
  mode:
    description: "`dry-run` (default), `gate` (wait for an already published campaign) or `publish` (create a capped Dig order on your Orders node and wait for its gate; workflow_dispatch / protected push / labelled same-repo PR only)."
    required: false
    default: dry-run
  hackme-url:
    description: "Gate mode: base URL of the node that serves the campaign report (https)."
    required: false
    default: ""
  campaign-id:
    description: "Gate mode: campaign to wait for."
    required: false
    default: ""
  ci-token:
    description: "Publish mode: scoped Orders CI token (HACKME_CI_TOKEN on the node). Pass it from a secret."
    required: false
    default: ""
  publish-label:
    description: "Publish mode: PR label that opts a same-repo PR into a real publish. Empty = PRs never publish."
    required: false
    default: ""
  report-token:
    description: "Gate mode: customer report token. Pass it from a secret; it is only handed to the engine via env."
    required: false
    default: ""
  gate-timeout:
    description: "Gate mode: max wait for the campaign to finish (Go duration, ≤ 6h)."
    required: false
    default: 30m
  max-critical:
    description: "Gate mode: allowed crash-class critical findings."
    required: false
    default: "0"
  max-high:
    description: "Gate mode: allowed crash-class high findings."
    required: false
    default: "0"
  min-runs-done:
    description: "Gate mode: required runs; -1 means the full budget."
    required: false
    default: "-1"
  comment:
    description: "Post / update a sticky PR comment with the result (needs `pull-requests: write`; skipped with a warning on fork PRs)."
    required: false
    default: "true"
  fail-on-reject:
    description: Fail the job when the wasm is rejected (dry-run) or the gate does not pass (gate).
    required: false
    default: "true"
  github-token:
    description: Token for the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  valid:
    description: "`true` when the wasm passed the pool gate."
    value: ${{ steps.run.outputs.valid }}
  source:
    description: "`dig_preset` or `custom_wasm`."
    value: ${{ steps.run.outputs.source }}
  dig-preset:
    description: Resolved Dig preset id.
    value: ${{ steps.run.outputs.dig-preset }}
  guard-pack:
    description: Resolved guard pack id.
    value: ${{ steps.run.outputs.guard-pack }}
  dig-package:
    description: Resolved Dig package.
    value: ${{ steps.run.outputs.dig-package }}
  wasm-sha256:
    description: sha256 of the guard wasm.
    value: ${{ steps.run.outputs.wasm-sha256 }}
  wasm-bytes:
    description: Size of the guard wasm.
    value: ${{ steps.run.outputs.wasm-bytes }}
  plan-path:
    description: Path to the plan JSON (what a real publish would send, wasm referenced by hash).
    value: ${{ steps.run.outputs.plan-path }}
  campaign-id:
    description: "Publish mode: id of the campaign that was created."
    value: ${{ steps.run.outputs.campaign-id }}
  gate-pass:
    description: "Gate/publish mode: `true` only for a completed campaign whose gate passed."
    value: ${{ steps.gate.outputs.gate-pass || steps.run.outputs.gate-pass }}
  campaign-status:
    description: "Gate mode: last campaign status seen."
    value: ${{ steps.gate.outputs.campaign-status || steps.run.outputs.campaign-status }}
  runs-done:
    description: "Gate mode: runs done."
    value: ${{ steps.gate.outputs.runs-done || steps.run.outputs.runs-done }}
  critical-count:
    description: "Gate mode: crash-class critical findings."
    value: ${{ steps.gate.outputs.critical-count || steps.run.outputs.critical-count }}
  high-count:
    description: "Gate mode: crash-class high findings."
    value: ${{ steps.gate.outputs.high-count || steps.run.outputs.high-count }}

runs:
  using: composite
  steps:
    # setup-go refuses '..' in cache paths, so resolve the hackme root once.
    - name: Locate hackme checkout
      id: root
      shell: bash
      run: echo "dir=$(cd "$GITHUB_ACTION_PATH/../.." && pwd -P)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.root.outputs.dir }}/go.mod
        cache-dependency-path: ${{ steps.root.outputs.dir }}/go.sum

    - name: Add wasm32 target for Rust
      if: inputs.mode != 'gate' && (inputs.language == 'rust' || inputs.language == 'rs' || ((inputs.dig-preset != '' || inputs.guard-pack != '') && inputs.wasm == '' && inputs.source == ''))
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Build hackme-fuzz-action
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/hackme-fuzz-action"
        go build -trimpath -o "$RUNNER_TEMP/hackme-fuzz-action/hackme-fuzz-action" ./cmd/hackme-fuzz-action

    - name: Dry-run / publish
      id: run
      if: inputs.mode != 'gate'
      shell: bash
      env:
        HACKME_CI_TOKEN: ${{ inputs.ci-token }}
        HFA_URL: ${{ inputs.hackme-url }}
        HFA_PUBLISH_LABEL: ${{ inputs.publish-label }}
        HFA_LABEL: ${{ github.repository }}${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || format('@{0}', github.ref_name) }}
        HFA_REF_PROTECTED: ${{ github.ref_protected }}
        HFA_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        HFA_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HFA_BASE_REPO: ${{ github.repository }}
        HFA_TIMEOUT: ${{ inputs.gate-timeout }}
        HFA_MAX_CRITICAL: ${{ inputs.max-critical }}
        HFA_MAX_HIGH: ${{ inputs.max-high }}
        HFA_MIN_RUNS: ${{ inputs.min-runs-done }}
        HFA_HACKME_ROOT: ${{ steps.root.outputs.dir }}
        HFA_WASM: ${{ inputs.wasm }}
        HFA_SOURCE: ${{ inputs.source }}
        HFA_LANGUAGE: ${{ inputs.language }}
        HFA_DIG_PRESET: ${{ inputs.dig-preset }}
        HFA_GUARD_PACK: ${{ inputs.guard-pack }}
        HFA_PACKAGE: ${{ inputs.package }}
        HFA_TITLE: ${{ inputs.title }}
        HFA_MODE: ${{ inputs.mode }}
      run: |
        set -uo pipefail
        bin="$RUNNER_TEMP/hackme-fuzz-action/hackme-fuzz-action"
        # Fresh dir per invocation: a second call in the same job must not
        # overwrite the plan an earlier step's plan-path still points at.
        out="$(mktemp -d "$RUNNER_TEMP/hackme-fuzz-action/run.XXXXXX")"
        args=(-mode "$HFA_MODE" -workspace "$GITHUB_WORKSPACE" -hackme-root "$HFA_HACKME_ROOT"
              -plan-out "$out/plan.json" -markdown-out "$out/comment.md" -github-output "$GITHUB_OUTPUT")
        [ -n "$HFA_WASM" ]       && args+=(-wasm "$HFA_WASM")
        [ -n "$HFA_SOURCE" ]     && args+=(-source "$HFA_SOURCE")
        [ -n "$HFA_LANGUAGE" ]   && args+=(-language "$HFA_LANGUAGE")
        [ -n "$HFA_DIG_PRESET" ] && args+=(-dig-preset "$HFA_DIG_PRESET")
        [ -n "$HFA_GUARD_PACK" ] && args+=(-guard-pack "$HFA_GUARD_PACK")
        [ -n "$HFA_PACKAGE" ]    && args+=(-package "$HFA_PACKAGE")
        [ -n "$HFA_TITLE" ]      && args+=(-title "$HFA_TITLE")
        if [ "$HFA_MODE" = publish ]; then
          case "$HACKME_CI_TOKEN" in
            *$'\n'*|*$'\r'*) ;;
            ?*) echo "::add-mask::$HACKME_CI_TOKEN" ;;
          esac
          args+=(-hackme-url "$HFA_URL" -label "$HFA_LABEL" -publish-label "$HFA_PUBLISH_LABEL"
                 -gate-timeout "$HFA_TIMEOUT" -max-critical "$HFA_MAX_CRITICAL" -max-high "$HFA_MAX_HIGH"
                 -min-runs-done "$HFA_MIN_RUNS")
        else
          # The CI token is only for publish; don't hand it to a dry-run.
          unset HACKME_CI_TOKEN
        fi
        # `shell: bash` runs with -e on GitHub, so catch the code instead of dying here.
        code=0
        "$bin" "${args[@]}" || code=$?
        if [ -f "$out/comment.md" ]; then
          cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "plan-path=$out/plan.json" >> "$GITHUB_OUTPUT"
          echo "comment-path=$out/comment.md" >> "$GITHUB_OUTPUT"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # The verdict step fails the job; exiting 0 here lets the PR comment go out first.
        exit 0

    - name: Gate
      id: gate
      if: inputs.mode == 'gate'
      shell: bash
      env:
        HACKME_REPORT_TOKEN: ${{ inputs.report-token }}
        HFA_URL: ${{ inputs.hackme-url }}
        HFA_CAMPAIGN: ${{ inputs.campaign-id }}
        HFA_TIMEOUT: ${{ inputs.gate-timeout }}
        HFA_MAX_CRITICAL: ${{ inputs.max-critical }}
        HFA_MAX_HIGH: ${{ inputs.max-high }}
        HFA_MIN_RUNS: ${{ inputs.min-runs-done }}
      run: |
        set -uo pipefail
        # Secrets are masked already; mask anyway in case the token came from
        # somewhere else. Never echo a value with a line break (the tail would leak).
        case "$HACKME_REPORT_TOKEN" in
          *$'\n'*|*$'\r'*) ;;
          ?*) echo "::add-mask::$HACKME_REPORT_TOKEN" ;;
        esac
        bin="$RUNNER_TEMP/hackme-fuzz-action/hackme-fuzz-action"
        out="$(mktemp -d "$RUNNER_TEMP/hackme-fuzz-action/run.XXXXXX")"
        code=0
        "$bin" -mode gate -hackme-url "$HFA_URL" -campaign-id "$HFA_CAMPAIGN" \
          -gate-timeout "$HFA_TIMEOUT" -max-critical "$HFA_MAX_CRITICAL" -max-high "$HFA_MAX_HIGH" \
          -min-runs-done "$HFA_MIN_RUNS" -markdown-out "$out/comment.md" -github-output "$GITHUB_OUTPUT" || code=$?
        if [ -f "$out/comment.md" ]; then
          cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "comment-path=$out/comment.md" >> "$GITHUB_OUTPUT"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && (steps.run.outputs.comment-path != '' || steps.gate.outputs.comment-path != '')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HFA_MARKER: ${{ inputs.mode == 'dry-run' && 'dry-run' || 'gate' }}
        HFA_REPO: ${{ github.repository }}
        HFA_PR: ${{ github.event.pull_request.number }}
        HFA_BODY: ${{ steps.run.outputs.comment-path || steps.gate.outputs.comment-path }}
      run: bash "$GITHUB_ACTION_PATH/comment.sh"

    - name: Verdict
      shell: bash
      env:
        HFA_CODE: ${{ steps.run.outputs.exit-code || steps.gate.outputs.exit-code }}
        HFA_FAIL_ON_REJECT: ${{ inputs.fail-on-reject }}
        HFA_MODE: ${{ inputs.mode }}
      run: |
        if [ "$HFA_MODE" = gate ] || [ "$HFA_MODE" = publish ]; then
          ok="Campaign finished and the gate passed."
          bad="gate did not pass or the campaign did not finish — see the job summary"
        else
          ok="Guard wasm passes the pool gate (dry-run, nothing sent)."
          bad="guard wasm rejected or failed to build — see the job summary"
        fi
        case "$HFA_CODE" in
          0) echo "$ok" ;;
          1) if [ "$HFA_FAIL_ON_REJECT" = "true" ]; then
               echo "::error title=HackMe Dig::$bad"
               exit 1
             fi
             echo "::warning title=HackMe Dig::$bad" ;;
          *) echo "::error title=HackMe Dig::bad action inputs (exit ${HFA_CODE:-?}) — see the step log"
             exit 1 ;;
        esac
